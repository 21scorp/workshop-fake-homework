<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#1b1748"/>
      <stop offset="55%" stop-color="#0a0c22"/>
      <stop offset="100%" stop-color="#04050e"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- falling stars -->
  <g stroke="#67e8f9" stroke-linecap="round" opacity="0.5">
    <line x1="96"  y1="60"  x2="120" y2="130" stroke-width="4"/>
    <line x1="392" y1="80"  x2="410" y2="140" stroke-width="3"/>
    <line x1="300" y1="42"  x2="314" y2="92"  stroke-width="2"/>
  </g>
  <g fill="#dbeafe" opacity="0.75">
    <circle cx="76"  cy="196" r="3"/>
    <circle cx="438" cy="228" r="4"/>
    <circle cx="150" cy="404" r="3"/>
    <circle cx="360" cy="430" r="2.5"/>
    <circle cx="256" cy="118" r="2.5"/>
  </g>

  <!-- the mark -->
  <g filter="url(#glow)">
    <path d="M256 96 L292 208 L404 244 L292 280 L256 392 L220 280 L108 244 L220 208 Z"
          fill="url(#star)"/>
  </g>
  <circle cx="256" cy="244" r="26" fill="#ffffff" opacity="0.92"/>
</svg>
