<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>ASTRAFALL</title>
<meta name="description" content="Eén duim. Zestig seconden. Verzamel Astra, overleef de sterrenval.">

<meta property="og:title" content="ASTRAFALL">
<meta property="og:description" content="Eén duim. Zestig seconden. Verzamel Astra, overleef de sterrenval.">
<meta property="og:type" content="website">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/ui.css">
<link rel="stylesheet" href="./styles/screens.css">
</head>
<body>

<!-- ============ BOOT / LOADER ============ -->
<div id="boot" class="boot">
  <div class="boot__mark">
    <svg viewBox="0 0 120 120" class="boot__glyph" aria-hidden="true">
      <defs>
        <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22d3ee"/>
          <stop offset="50%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
      </defs>
      <path d="M60 6 L70 44 L108 54 L70 64 L60 102 L50 64 L12 54 L50 44 Z" fill="url(#bg1)"/>
    </svg>
  </div>
  <div class="boot__title">ASTRAFALL</div>
  <div class="boot__bar"><i id="bootBar"></i></div>
  <div class="boot__hint" id="bootHint">systemen kalibreren…</div>
</div>

<!-- ============ GAME STAGE ============ -->
<div id="stage" class="stage" hidden>
  <canvas id="gameCanvas" class="stage__canvas"></canvas>

  <!-- DOM overlay layer for all UI -->
  <div id="ui" class="ui"></div>

  <!-- Persistent HUD lives outside screen router so it can animate independently -->
  <div id="hud" class="hud" hidden></div>

  <!-- Full-screen FX overlays (vignette, flash, chroma) -->
  <div class="fx-layer" aria-hidden="true">
    <div id="fxFlash" class="fx-flash"></div>
    <div id="fxVignette" class="fx-vignette"></div>
    <div id="fxScanline" class="fx-scanline"></div>
  </div>

  <!-- Toast rail -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<!-- Rotate hint for landscape phones -->
<div class="rotate-hint">
  <div class="rotate-hint__inner">
    <div class="rotate-hint__icon">📱</div>
    <p>Draai je toestel<br><strong>ASTRAFALL speelt verticaal</strong></p>
  </div>
</div>

<noscript>
  <div class="noscript">ASTRAFALL heeft JavaScript nodig.</div>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
